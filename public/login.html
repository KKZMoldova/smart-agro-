<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Smart Agro</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0f0d;--surface:#111812;--surface2:#182019;
  --border:#2a3a2b;--accent:#4ade80;--red:#ef4444;
  --text:#e8f5e9;--text2:#a5b4a7;--text3:#5a6e5c;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:13px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:340px;max-width:92vw;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.logo-icon{font-size:26px;}
.logo h1{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.ff{margin-bottom:16px;}
input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;}
input:focus{outline:none;border-color:var(--accent);}
button{width:100%;padding:11px;background:var(--accent);color:#06210f;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Unbounded',sans-serif;letter-spacing:.5px;}
button:disabled{opacity:.6;cursor:default;}
#err{color:var(--red);font-size:12px;margin-bottom:12px;display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="logo-icon">🍒</span><h1>SMART AGRO</h1></div>
  <div id="err"></div>
  <form id="login-form">
    <div class="ff"><label>Логин</label><input type="text" id="username" autocomplete="username" required></div>
    <div class="ff"><label>Пароль</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button type="submit" id="submit-btn">Войти</button>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Вход...';
  try {
    const r = await fetch('/api/auth/login-company', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Ошибка входа');
    sessionStorage.setItem('agro_token', d.token);
    sessionStorage.setItem('agro_role', d.role);
    sessionStorage.setItem('agro_company_id', d.companyId || '');
    sessionStorage.setItem('agro_tenant_name', d.companyName || '');
    sessionStorage.setItem('agro_user_name', document.getElementById('username').value.trim());
    window.location.href = '/';
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Войти';
  }
});
</script>
</body>
</html>
