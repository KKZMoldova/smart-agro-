<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Smart Agro</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0f0d;--surface:#111812;--surface2:#182019;
  --border:#2a3a2b;--accent:#4ade80;--red:#ef4444;
  --text:#e8f5e9;--text2:#a5b4a7;--text3:#5a6e5c;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:13px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:340px;max-width:92vw;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.logo-icon{font-size:26px;}
.logo h1{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.ff{margin-bottom:16px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-toggle{position:absolute;right:0;top:0;width:auto;padding:0 12px;height:100%;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;}
input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;}
input:focus{outline:none;border-color:var(--accent);}
button[type=submit]{width:100%;padding:11px;background:var(--accent);color:#06210f;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Unbounded',sans-serif;letter-spacing:.5px;}
button:disabled{opacity:.6;cursor:default;}
#err{color:var(--red);font-size:12px;margin-bottom:12px;display:none;}
.hint{font-size:11px;color:var(--text3);margin-bottom:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="logo-icon">🍒</span><h1>SMART AGRO</h1></div>
  <div id="err"></div>

  <form id="login-form">
    <div class="ff"><label>Логин</label><input type="text" id="username" autocomplete="username" required></div>
    <div class="ff pw-wrap"><label>Пароль</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-for="password">👁</button>
    </div>
    <button type="submit" id="submit-btn">Войти</button>
  </form>

  <form id="change-form" style="display:none;">
    <div class="hint">Это первый вход — придумайте новый пароль перед тем, как продолжить.</div>
    <div class="ff pw-wrap"><label>Новый пароль</label>
      <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
      <button type="button" class="pw-toggle" data-for="new-password">👁</button>
    </div>
    <div class="ff pw-wrap"><label>Повторите новый пароль</label>
      <input type="password" id="new-password2" autocomplete="new-password" required minlength="6">
      <button type="button" class="pw-toggle" data-for="new-password2">👁</button>
    </div>
    <button type="submit" id="change-btn">Сохранить и войти</button>
  </form>
</div>
<script>
document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.for);
    input.type = input.type === 'password' ? 'text' : 'password';
  });
});

let _loginUsername = '';
let _loginPassword = '';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Вход...';
  _loginUsername = document.getElementById('username').value.trim();
  _loginPassword = document.getElementById('password').value;
  try {
    const r = await fetch('/api/auth/login-company', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: _loginUsername, password: _loginPassword }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Ошибка входа');
    sessionStorage.setItem('agro_token', d.token);
    sessionStorage.setItem('agro_role', d.role);
    sessionStorage.setItem('agro_company_id', d.companyId || '');
    sessionStorage.setItem('agro_tenant_name', d.companyName || '');
    sessionStorage.setItem('agro_user_name', _loginUsername);
    if (d.mustChangePassword) {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('change-form').style.display = 'block';
      return;
    }
    window.location.href = '/';
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Войти';
  }
});

document.getElementById('change-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('change-btn');
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  const newPassword = document.getElementById('new-password').value;
  const newPassword2 = document.getElementById('new-password2').value;
  if (newPassword !== newPassword2) {
    errEl.textContent = 'Пароли не совпадают';
    errEl.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = 'Сохранение...';
  try {
    const r = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionStorage.getItem('agro_token') },
      body: JSON.stringify({ currentPassword: _loginPassword, newPassword }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Ошибка смены пароля');
    window.location.href = '/';
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Сохранить и войти';
  }
});
</script>
</body>
</html>
